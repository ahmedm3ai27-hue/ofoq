# Ai27 WeatherOS — يبني الواجهة (HTML/JS) + Capacitor إلى APK سحابياً
name: Build Ai27 WeatherOS APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 1) ملفات الواجهة وإعدادات Capacitor
        run: |
          mkdir -p $(dirname package.json)
          cat > package.json <<'WOS_EOF'
          {"name":"ai27-weatheros","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^6.1.0","@capacitor/cli":"^6.1.0","@capacitor/core":"^6.1.0"}}
          WOS_EOF
          mkdir -p $(dirname capacitor.config.json)
          cat > capacitor.config.json <<'WOS_EOF'
          {
            "appId": "com.ai27.weatheros",
            "appName": "Ai27 WeatherOS",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          WOS_EOF
          mkdir -p $(dirname www/index.html)
          cat > www/index.html <<'WOS_EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
          <title>Ai27 WeatherOS</title>
          <style>
          /* ===== المتغيرات: تتحدث من JavaScript حسب الوقت والطقس ===== */
          :root{--st:30px;--nb:18px;--sx:6px;--sy:8px;--shb:10px;--sa:.3;--tint:rgba(120,170,230,.28);--top:#0d1230;--bot:#3b2b66;--cc:rgba(255,255,255,.9)}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
          html,body{height:100%;overflow:hidden;background:#0d1230;color:#fff;font-family:'Noto Sans Arabic','Segoe UI',Roboto,sans-serif}
          button{font:inherit;color:inherit}
          #sky{position:fixed;inset:0;background:linear-gradient(var(--top),var(--bot))}
          canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
          #stars{z-index:1}
          #sun,#moon{position:fixed;border-radius:50%;z-index:2;transform:translate(-50%,-50%);transition:opacity 1.5s}
          #sun{width:84px;height:84px;background:radial-gradient(circle,#fffbe6 0 38%,#ffd36b 62%,rgba(255,190,80,0) 74%);box-shadow:0 0 60px 30px rgba(255,200,90,.45)}
          #moon{width:56px;height:56px;background:radial-gradient(circle at 35% 35%,#fff,#dfe6f5 60%,#b5c0d8);box-shadow:0 0 40px 12px rgba(200,215,255,.35)}
          #clouds{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity 1.5s}
          .cl{position:absolute;will-change:transform}
          .cl i{display:block;width:100%;height:100%;border-radius:50%;filter:blur(14px);
           background:radial-gradient(ellipse at 30% 60%,var(--cc) 0 38%,transparent 70%),radial-gradient(ellipse at 70% 40%,var(--cc) 0 42%,transparent 72%);
           animation:drift var(--d) ease-in-out infinite alternate}
          @keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
          #ui{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 22px calc(var(--nb) + 12px)}
          #greet{font-size:17px;opacity:.88;text-shadow:0 1px 4px rgba(0,0,0,.35)}
          #clock{font-size:86px;font-weight:200;line-height:1;letter-spacing:-2px;direction:ltr;text-align:right;text-shadow:0 2px 14px rgba(0,0,0,.25)}
          #date{font-size:14px;opacity:.78;text-shadow:0 1px 4px rgba(0,0,0,.35)}
          .glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
          #wchip{margin-top:12px;align-self:flex-start;border-radius:99px;padding:8px 16px;font-size:14px;display:flex;gap:10px}
          .sp{flex:1}
          #err{display:none;font-size:12px;background:rgba(255,80,80,.28);border-radius:12px;padding:8px 12px;margin-bottom:10px;user-select:text}
          #fav,#all{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 4px}
          /* ===== الأيقونات الزجاجية + الظلال الديناميكية ===== */
          .app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;min-width:0;text-shadow:0 1px 3px rgba(0,0,0,.5)}
          .app span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .ic{width:62px;height:62px;border-radius:21px;display:grid;place-items:center;
           background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.07)),var(--tint);
           border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
           box-shadow:var(--sx) var(--sy) var(--shb) rgba(0,0,0,var(--sa)),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
          .ic img{width:44px;height:44px;border-radius:12px}
          .app:active .ic{transform:scale(.92)}
          #handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.5);margin:18px auto 12px}
          #pill{height:52px;border-radius:26px;color:rgba(255,255,255,.88);font-size:15px;text-align:start;padding:0 20px}
          #drawer{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(var(--nb) + 10px);
           background:rgba(6,9,26,.5);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
          #drawer.on{transform:none}
          #q{height:52px;border-radius:26px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:16px;padding:0 20px;outline:0;margin-bottom:14px;-webkit-user-select:text;user-select:text}
          #q::placeholder{color:rgba(255,255,255,.6)}
          #all{flex:1;overflow-y:auto;align-content:start;touch-action:pan-y}
          #panel{position:fixed;left:12px;right:12px;bottom:calc(var(--nb) + 12px);z-index:6;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;
           background:rgba(12,16,40,.78);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);transform:translateY(140%);transition:transform .3s}
          #panel.on{transform:none}
          #panel label{display:flex;justify-content:space-between;font-size:14px}
          #panel input[type=range]{width:100%}
          .row{display:flex;gap:8px}
          .row button,#pr{flex:1;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);border-radius:14px;padding:10px 4px;font-size:13px}
          </style>
          </head>
          <body>
          <div id="sky"></div>
          <canvas id="stars"></canvas>
          <div id="sun"></div><div id="moon"></div>
          <div id="clouds"></div>
          <div id="ui">
            <div id="greet"></div>
            <div id="clock">0:00</div>
            <div id="date"></div>
            <button id="wchip" class="glass"><b id="wt">--°</b><span id="wd">جارٍ جلب الطقس…</span></button>
            <div class="sp"></div>
            <div id="err"></div>
            <div id="fav"></div>
            <div id="handle"></div>
            <button id="pill" class="glass">ابحث في هاتفك</button>
          </div>
          <div id="drawer"><input id="q" placeholder="ابحث عن تطبيق" autocomplete="off"><div id="all"></div></div>
          <!-- لوحة التجربة: اضغط مطولاً على الساعة أو اضغط شريحة الطقس -->
          <div id="panel">
            <label><b>لوحة التجربة</b><output id="po">تلقائي</output></label>
            <input type="range" id="ph" min="0" max="23.75" step="0.25" value="12">
            <div class="row"><button data-w="auto">تلقائي</button><button data-w="clear">مشمس</button><button data-w="cloudy">غائم</button><button data-w="rain">ممطر</button></div>
            <button id="pr">رجوع للوضع الحقيقي</button>
          </div>
          <canvas id="rain" style="z-index:8"></canvas>
          <script>
          (()=>{
          'use strict';
          /* ===== الإعدادات ===== */
          const NAME='أحمد', LAT=30.5877, LON=31.5020;            // الزقازيق، مصر
          const $=s=>document.querySelector(s), R=document.documentElement.style;
          const Cap=window.Capacitor, native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
          // جسر الاتصال مع إضافة الأندرويد AppsPlugin
          const call=(m,a)=>{const P=Cap&&Cap.Plugins&&Cap.Plugins.Apps;
            if(P&&P[m])return P[m](a||{});
            if(Cap&&Cap.nativePromise)return Cap.nativePromise('Apps',m,a||{});
            return Promise.reject(new Error('Capacitor غير متاح'))};
          const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
          const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
          const mix=(a,b,t)=>a.map((v,i)=>Math.round(lerp(v,b[i],t)));
          const ov={h:null,w:null}, real={type:'clear',label:'صافٍ',temp:null};
          let cur={night:true,wx:'clear'};

          /* ===== ألوان السماء حسب الساعة: [الساعة، أعلى، أسفل] ===== */
          const A=[[0,'#070b1e','#241a45'],[5,'#141a45','#4a3770'],[6.3,'#37508f','#f09a6a'],[9,'#2f73c9','#86c4ee'],
           [13,'#2a6cc2','#7dbdec'],[16.5,'#3a6fb5','#f2b37a'],[18.2,'#3a2f6b','#e2735a'],[19.5,'#161a47','#4b3a78'],[24,'#070b1e','#241a45']];
          function sky(h){for(let i=0;i<A.length-1;i++){const a=A[i],b=A[i+1];
            if(h>=a[0]&&h<=b[0]){const t=(h-a[0])/(b[0]-a[0]);return[mix(hex(a[1]),hex(b[1]),t),mix(hex(a[2]),hex(b[2]),t)]}}
            return[hex(A[0][1]),hex(A[0][2])]}
          const curHour=()=>{if(ov.h!=null)return ov.h;const d=new Date();return d.getHours()+d.getMinutes()/60};
          const fmtH=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0');

          /* ===== الغيوم (Parallax) ===== */
          const cls=[];
          [[-10,12,260,110,.3,26],[55,8,300,120,.5,34],[20,26,220,90,.9,22],[65,30,260,100,1.1,30],[-5,42,280,110,.7,28],[48,52,240,100,1.3,24],[75,18,200,80,.4,20]]
          .forEach(([x,y,w,h,d,du])=>{const e=document.createElement('div');e.className='cl';
            e.style.cssText=`left:${x}vw;top:${y}vh;width:${w}px;height:${h}px`;
            e.innerHTML=`<i style="--d:${du}s"></i>`;$('#clouds').appendChild(e);cls.push({e,d})});
          let tx=0,ty=0,px=0,py=0;
          addEventListener('deviceorientation',e=>{tx=clamp((e.gamma||0)/30,-1,1);ty=clamp(((e.beta||0)-45)/30,-1,1)});

          /* ===== العرض الرئيسي: سماء + شمس + ظلال + غيوم + طقس ===== */
          function render(){
            const h=curHour(), wx=ov.w||real.type, day=h>=6&&h<=18;
            let [t,b]=sky(h);
            const k={clear:[0,0],cloudy:[.6,.1],rain:[.75,.28]}[wx];
            const dull=c=>{const L=c[0]*.3+c[1]*.59+c[2]*.11;return c.map((v,i)=>Math.round(lerp(v,L*[1,1.03,1.12][i],k[0])*(1-k[1])))};
            t=dull(t);b=dull(b);
            R.setProperty('--top',`rgb(${t})`);R.setProperty('--bot',`rgb(${b})`);R.setProperty('--tint',`rgba(${b},.28)`);
            const dim={clear:1,cloudy:.5,rain:.12}[wx];
            // مسار الشمس: شروق 6 ← غروب 18 ، والقمر بالعكس
            const sa=Math.PI*clamp((h-6)/12,0,1), mh=h>=18?h-18:h+6, ma=Math.PI*mh/12;
            const put=(el,a,vis)=>{el.style.display=vis?'block':'none';el.style.left=(50-42*Math.cos(a))+'vw';el.style.top=(64-52*Math.sin(a))+'vh';el.style.opacity=dim};
            put($('#sun'),sa,day);put($('#moon'),ma,!day);
            // ظلال الأيقونات تعاكس اتجاه الشمس وتطول عند الشروق والغروب
            const a=day?sa:ma, s=Math.max(Math.sin(a),.2), L=Math.min(24,6/s);
            R.setProperty('--sx',(Math.cos(a)*L).toFixed(1)+'px');
            R.setProperty('--sy',(4+7*s).toFixed(1)+'px');
            R.setProperty('--shb',(5+(1-s)*10).toFixed(1)+'px');
            R.setProperty('--sa',((day?.3:.2)*(.35+.65*dim)).toFixed(2));
            // لون وكثافة الغيوم
            const lum=t[0]*.3+t[1]*.59+t[2]*.11, cc=lum>85?[246,249,255]:[125,135,178];
            const cf=wx==='rain'?mix(cc,[62,74,94],.7):wx==='cloudy'?mix(cc,[150,158,170],.25):cc;
            R.setProperty('--cc',`rgba(${cf},.9)`);
            $('#clouds').style.opacity={clear:.2,cloudy:.95,rain:1}[wx];
            // النصوص
            const lab=ov.w?{clear:day?'مشمس':'صافٍ',cloudy:'غائم',rain:'ممطر'}[ov.w]:(real.type==='clear'?(day?'مشمس':'صافٍ'):real.label);
            $('#wt').textContent=(real.temp!=null?Math.round(real.temp):'--')+'°';
            $('#wd').textContent=lab;
            $('#greet').textContent=(h>=5&&h<12?'صباح الخير':h>=12&&h<21?'مساء الخير':'ليلة هادئة')+' يا '+NAME;
            cur={night:!day,wx};
          }
          function tickTime(){
            const d=new Date(), h=ov.h!=null?ov.h:d.getHours(), m=ov.h!=null?Math.round((ov.h%1)*60):d.getMinutes();
            $('#clock').textContent=((Math.floor(h)%12)||12)+':'+String(m).padStart(2,'0');
            $('#date').textContent=new Intl.DateTimeFormat('ar-EG-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long'}).format(d)+' · '+new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long'}).format(d);
          }

          /* ===== الطقس الحقيقي من Open-Meteo (بدون مفتاح) ===== */
          const wmap=c=>c<=1?{type:'clear',label:'صافٍ'}:c===2?{type:'cloudy',label:'غائم جزئياً'}:c===3?{type:'cloudy',label:'غائم'}:
           (c===45||c===48)?{type:'cloudy',label:'ضباب'}:((c>=51&&c<=67)||(c>=80&&c<=82))?{type:'rain',label:'أمطار'}:
           c>=95?{type:'rain',label:'عاصفة رعدية'}:(c>=71&&c<=77)?{type:'cloudy',label:'ثلوج'}:{type:'cloudy',label:'غائم'};
          function setW(c,t){const m=wmap(c);real.type=m.type;real.label=m.label;real.temp=t;render()}
          let lastW=0;
          async function weather(){
            lastW=Date.now();
            try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=Africa%2FCairo`);
              const c=(await r.json()).current;setW(c.weather_code,c.temperature_2m);
              localStorage.setItem('wx',JSON.stringify({c:c.weather_code,t:c.temperature_2m}))}
            catch(e){try{const s=JSON.parse(localStorage.getItem('wx')||'null');if(s)setW(s.c,s.t);else $('#wd').textContent='الطقس غير متاح'}catch(_){}}
          }

          /* ===== التطبيقات ===== */
          let apps=[],lp=false,lastA=0;
          const G=[['chat',/whatsapp|telegram|messag|sms|snap|facebook|instagram|twitter|tiktok|viber|dialer|phone|contacts/],
           ['media',/youtube|music|spotify|photo|gallery|camera|video|player|netflix/],['web',/chrome|brave|browser|firefox|edge|opera|\.gm$|mail|maps/],
           ['tools',/setting|calc|clock|file|manager|note|docs|drive|store|vending/]];
          const grp=p=>{for(const[n,r]of G)if(r.test(p))return n;return'other'};
          const uses=()=>{try{return JSON.parse(localStorage.getItem('uses')||'{}')}catch(e){return{}}};
          const err=m=>{const e=$('#err');e.style.display=m?'block':'none';e.textContent=m||''};
          function demo(){const C=['#e9b95e','#5ef2d6','#ff7a90','#8aa4ff','#9be37f','#ffb36b'];
            return'متصفح كاميرا رسائل خرائط ملفات ساعة صور يوتيوب واتساب إعدادات حاسبة موسيقى'.split(' ').map((n,i)=>({label:n,pkg:'demo.'+i,
             icon:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44"><rect width="44" height="44" rx="12" fill="${C[i%6]}"/><text x="22" y="29" font-size="20" text-anchor="middle" fill="#fff" font-family="sans-serif">${n[0]}</text></svg>`)}))}
          async function loadApps(){
            lastA=Date.now();
            try{const r=await call('list');apps=(r.apps||[]).sort((a,b)=>a.label.localeCompare(b.label,'ar'));err('')}
            catch(e){apps=native?[]:demo();if(native)err('تعذر جلب التطبيقات: '+(e.message||e))}
            buildFav();buildAll();
          }
          function tile(a){
            const d=document.createElement('div');d.className='app';
            d.innerHTML=`<div class="ic"><img alt="" src="${a.icon}"></div><span></span>`;d.lastChild.textContent=a.label;
            let t;d.addEventListener('touchstart',()=>{lp=false;t=setTimeout(()=>{lp=true;call('info',{pkg:a.pkg}).catch(()=>{})},550)},{passive:true});
            ['touchend','touchmove','touchcancel'].forEach(e=>d.addEventListener(e,()=>clearTimeout(t),{passive:true}));
            d.addEventListener('click',()=>{if(lp){lp=false;return}open(a)});
            return d;
          }
          function open(a){
            const u=uses();u[a.pkg]=(u[a.pkg]||0)+1;localStorage.setItem('uses',JSON.stringify(u));
            closeD();call('launch',{pkg:a.pkg}).catch(e=>err('تعذر التشغيل: '+(e.message||e)));
          }
          function buildFav(){
            const u=uses(),sc=a=>(u[a.pkg]||0)*100+(/whatsapp|chrome|youtube|facebook|instagram|telegram|photos|dialer|maps|\.gm$/.test(a.pkg)?50:0);
            const el=$('#fav');el.innerHTML='';
            [...apps].sort((a,b)=>sc(b)-sc(a)).slice(0,8).forEach(a=>{const t=tile(a);t.dataset.g=grp(a.pkg);el.appendChild(t)});
          }
          const filtered=()=>{const q=$('#q').value.trim().toLowerCase();return apps.filter(a=>!q||a.label.toLowerCase().includes(q))};
          function buildAll(){const el=$('#all');el.innerHTML='';filtered().forEach(a=>el.appendChild(tile(a)))}
          $('#q').addEventListener('input',buildAll);
          $('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const f=filtered()[0];if(f)open(f)}});

          /* ===== الدُّرج + زر الرجوع + السحب للأعلى ===== */
          let dOpen=false,pOpen=false;
          function openD(){if(dOpen)return;dOpen=true;$('#drawer').classList.add('on')}
          function closeD(){if(!dOpen)return;dOpen=false;$('#drawer').classList.remove('on');$('#q').value='';$('#q').blur();buildAll()}
          function togglePanel(){pOpen=!pOpen;$('#panel').classList.toggle('on',pOpen)}
          history.pushState({h:1},'');
          addEventListener('popstate',()=>{closeD();if(pOpen)togglePanel();history.pushState({h:1},'')});
          $('#pill').addEventListener('click',openD);
          let sy0=0,sx0=0;
          $('#ui').addEventListener('touchstart',e=>{sy0=e.touches[0].clientY;sx0=e.touches[0].clientX},{passive:true});
          $('#ui').addEventListener('touchend',e=>{const t=e.changedTouches[0];if(sy0-t.clientY>70&&Math.abs(t.clientX-sx0)<90)openD()},{passive:true});
          $('#drawer').addEventListener('touchstart',e=>{sy0=e.touches[0].clientY},{passive:true});
          $('#drawer').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy0>110&&$('#all').scrollTop<=0)closeD()},{passive:true});

          /* ===== لوحة التجربة ===== */
          let ct;const ck=$('#clock');
          ck.addEventListener('touchstart',()=>{ct=setTimeout(togglePanel,600)},{passive:true});
          ['touchend','touchmove','touchcancel'].forEach(e=>ck.addEventListener(e,()=>clearTimeout(ct),{passive:true}));
          $('#wchip').addEventListener('click',togglePanel);
          $('#ph').addEventListener('input',e=>{ov.h=+e.target.value;$('#po').textContent=fmtH(ov.h);tickTime();render()});
          document.querySelectorAll('#panel [data-w]').forEach(b=>b.addEventListener('click',()=>{ov.w=b.dataset.w==='auto'?null:b.dataset.w;render()}));
          $('#pr').addEventListener('click',()=>{ov.h=null;ov.w=null;$('#po').textContent='تلقائي';tickTime();render()});

          /* ===== الرسم: نجوم + كوكبات ليلية + مطر وقطرات قابلة للمسح ===== */
          const sc=$('#stars'),sx=sc.getContext('2d'),rc=$('#rain'),rx=rc.getContext('2d');
          let W,H;
          function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
            for(const c of[sc,rc]){c.width=W*d;c.height=H*d}
            sx.setTransform(d,0,0,d,0,0);rx.setTransform(d,0,0,d,0,0)}
          addEventListener('resize',size);size();
          const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.8,r:Math.random()*1.3+.3,p:Math.random()*6.28}));
          let drops=[];const streaks=Array.from({length:110},()=>({x:Math.random(),y:Math.random(),l:10+Math.random()*16,v:.6+Math.random()*.8}));
          addEventListener('pointermove',e=>{if(cur.wx==='rain')drops=drops.filter(d=>Math.hypot(d.x-e.clientX,d.y-e.clientY)>34)});
          function night(t){
            const al={clear:1,cloudy:.45,rain:.12}[cur.wx];
            for(const s of stars){sx.fillStyle=`rgba(255,255,255,${al*(.45+.55*Math.sin(t/700+s.p))})`;sx.beginPath();sx.arc(s.x*W,s.y*H,s.r,0,6.2832);sx.fill()}
            // كوكبات: خطوط مضيئة تربط التطبيقات المتشابهة
            const by={};
            document.querySelectorAll('#fav .app').forEach(e=>{const g=e.dataset.g;if(g==='other')return;const r=e.querySelector('.ic').getBoundingClientRect();(by[g]=by[g]||[]).push({x:r.left+r.width/2,y:r.top+r.height/2})});
            for(const g in by){const a=by[g];if(a.length<2)continue;
              sx.beginPath();a.forEach((n,i)=>i?sx.lineTo(n.x,n.y):sx.moveTo(n.x,n.y));
              sx.strokeStyle=`rgba(190,215,255,${.5*al+.1})`;sx.lineWidth=1.3;sx.shadowColor='rgba(150,190,255,.9)';sx.shadowBlur=8;sx.stroke();sx.shadowBlur=0;
              a.forEach(n=>{sx.fillStyle=`rgba(230,240,255,${.9*al+.1})`;sx.beginPath();sx.arc(n.x,n.y,2.6,0,6.2832);sx.fill()})}
          }
          function rain(){
            rx.strokeStyle='rgba(200,220,255,.35)';rx.lineWidth=1;rx.beginPath();
            for(const s of streaks){const x=s.x*W,y=s.y*H;rx.moveTo(x,y);rx.lineTo(x-2,y+s.l);s.y+=s.v*.014;if(s.y>1){s.y=-.05;s.x=Math.random()}}
            rx.stroke();
            if(drops.length<70&&Math.random()<.35)drops.push({x:Math.random()*W,y:Math.random()*H,r:1.8+Math.random()*3,s:0,v:0});
            for(const d of drops){d.r+=.004;if(!d.s&&d.r>5&&Math.random()<.01)d.s=1;if(d.s){d.v+=.05;d.y+=d.v}
              rx.beginPath();rx.ellipse(d.x,d.y,d.r*.85,d.r,0,0,6.2832);rx.fillStyle='rgba(255,255,255,.12)';rx.fill();rx.strokeStyle='rgba(255,255,255,.4)';rx.lineWidth=1;rx.stroke();
              rx.beginPath();rx.arc(d.x-d.r*.3,d.y-d.r*.35,d.r*.25,0,6.2832);rx.fillStyle='rgba(255,255,255,.75)';rx.fill()}
            drops=drops.filter(d=>d.y<H+20&&d.r<9);
          }
          function frame(t){
            requestAnimationFrame(frame);if(document.hidden)return;
            sx.clearRect(0,0,W,H);rx.clearRect(0,0,W,H);
            if(cur.night)night(t);
            if(cur.wx==='rain')rain();else if(drops.length)drops=[];
            px=lerp(px,tx,.06);py=lerp(py,ty,.06);
            for(const c of cls)c.e.style.transform=`translate3d(${(px*c.d*40).toFixed(1)}px,${(py*c.d*18).toFixed(1)}px,0)`;
          }

          /* ===== حواف الشاشة من النظام (شريط الحالة وشريط التنقل) ===== */
          async function insets(){try{const r=await call('insets');if(r.t)R.setProperty('--st',r.t+'px');if(r.b)R.setProperty('--nb',r.b+'px')}catch(e){}}
          let n=0;const iv=setInterval(()=>{insets();if(++n>20)clearInterval(iv)},500);
          document.addEventListener('visibilitychange',()=>{if(document.hidden)return;insets();tickTime();render();
            if(Date.now()-lastA>60000)loadApps();if(Date.now()-lastW>600000)weather()});

          /* ===== التشغيل ===== */
          tickTime();render();loadApps();weather();
          setInterval(()=>{tickTime();render()},20000);setInterval(weather,1200000);
          requestAnimationFrame(frame);
          })();
          </script>
          </body>
          </html>
          WOS_EOF

